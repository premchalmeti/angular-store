name: Deploy

on:
  workflow_dispatch:
    inputs:
      projects:
        description: "angular apps to deploy"
        required: true
      environment:
        description: "Environment to deploy"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - staging
          - dev
          - testing
          - qa

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

# The list of jobs to run
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Building ${{ github.event.inputs.projects }}
        run: |
          npx nx run-many --target=build --projects=${{ github.event.inputs.projects }} --configuration=${{ github.event.inputs.environment }} --skip-nx-cache

      - name: Deploying ${{ github.event.inputs.projects }} to ${{ github.event.inputs.environment }}
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: false
          ANGULAR_STORE_STAGING_BUCKET: ${{ vars.ANGULAR_STORE_STAGING_BUCKET }}
          ANGULAR_STORE_PROD_BUCKET: ${{ vars.ANGULAR_STORE_PROD_BUCKET }}
          ANGULAR_STORE_STAGING_CLOUDFRONT_ID: ${{ secrets.ANGULAR_STORE_STAGING_CLOUDFRONT_ID }}
          ANGULAR_STORE_PROD_CLOUDFRONT_ID: ${{ secrets.ANGULAR_STORE_PROD_CLOUDFRONT_ID }}
        run: |
          npx nx run-many --target=deploy --projects=${{ github.event.inputs.projects }} --configuration=${{ github.event.inputs.environment }}
